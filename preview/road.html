<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Road through History · Covenant Hymnal (preview)</title>
<link rel="icon" href="../assets/hymnal-seal-2.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
<style>
  :root{--bg:#f3f2f2;--ink:#1d2430;--muted:#5d6470;--navy:#1f3c5d;--gold:#b68235;--gold-d:#8a6024;--line:#d8d2c7;--card:#fbf9f5}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Lora,Georgia,serif;overflow:hidden}
  header{position:fixed;top:0;left:0;right:0;z-index:5;background:var(--navy);color:#f3efe6;display:flex;align-items:center;gap:16px;padding:10px 20px}
  header a{color:#e9d9b4;text-decoration:none;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
  header h1{margin:0;font-family:"Cormorant Garamond",serif;font-weight:500;font-size:clamp(18px,2.4vw,26px);letter-spacing:.14em;text-transform:uppercase;flex:1}
  #stage{position:fixed;inset:52px 0 112px 0}
  canvas.gl{display:block;width:100%;height:100%;cursor:grab}
  #lanes{position:fixed;top:62px;right:16px;z-index:4;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  #lanes button{font:14px Lora,serif;border:1px solid var(--line);background:rgba(251,249,245,.92);border-radius:999px;padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--ink)}
  #lanes button[aria-pressed=false]{opacity:.5}
  #lanes i{width:10px;height:10px;border-radius:50%;display:inline-block}
  #hint{position:fixed;top:66px;left:20px;z-index:4;font-size:14px;color:var(--muted);font-style:italic;max-width:40ch}
  footer{position:fixed;left:0;right:0;bottom:0;height:112px;background:var(--bg);border-top:1px solid var(--line);z-index:4;display:flex;flex-direction:column}
  #controls{display:flex;justify-content:center;align-items:center;gap:14px;padding:8px}
  #controls button{font:15px Lora,serif;min-height:40px;padding:0 16px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;color:var(--ink)}
  #controls button.fwd{border-color:var(--gold);color:var(--gold-d)}
  #count{font-variant-numeric:tabular-nums;color:var(--muted);min-width:120px;text-align:center;font-size:15px}
  #band{display:flex;flex:1;border-top:1px solid var(--line)}
  #band button{all:unset;cursor:pointer;flex:1;padding:6px 8px;border-right:1px solid var(--line);font:12px Lora,serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);position:relative}
  #band button[aria-current=true]{background:#efeae1;color:var(--ink);box-shadow:inset 0 -3px 0 var(--gold)}
  #band button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
  #panel{position:fixed;top:52px;right:0;bottom:112px;width:min(440px,100%);background:var(--card);border-left:1px solid var(--line);z-index:6;transform:translateX(100%);transition:transform .35s ease;overflow:auto;padding:22px 26px 30px}
  #panel.open{transform:none}
  #panel .x{position:absolute;top:10px;right:12px;font:28px/1 serif;border:0;background:none;cursor:pointer;color:var(--muted)}
  #panel .kick{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  #panel h2{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:32px;line-height:1.1;margin:6px 0 4px}
  #panel .yr{font-family:"Cormorant Garamond",serif;font-size:22px;color:var(--gold-d)}
  #panel img{width:100%;margin:14px 0 4px;border:6px solid #fff;outline:1px solid var(--line)}
  #panel .cr{font-size:12px;color:var(--muted)}
  #panel p{line-height:1.6}
  #panel blockquote{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:21px;line-height:1.4;margin:16px 0;padding-left:14px;border-left:3px solid var(--gold)}
  #panel a.go{display:inline-block;margin-top:10px;color:var(--gold-d)}
  #list{position:absolute;left:-9999px}
  #loading{position:fixed;inset:0;display:grid;place-items:center;font-family:"Cormorant Garamond",serif;font-size:24px;color:var(--muted);z-index:3}
  @media (max-width:700px){#hint{display:none}#lanes{top:58px;left:8px;right:8px;justify-content:center}#band button{font-size:10px;padding:6px 3px}}
</style>
</head>
<body>
<header><a href="index.html#/history">← History</a><h1>The Road through History</h1></header>
<div id="hint">Scroll, swipe or use the arrow keys to walk the road. Tap a card to read it.</div>
<div id="lanes" role="group" aria-label="Lanes"></div>
<div id="stage" aria-hidden="true"></div>
<div id="loading">Laying the road…</div>
<footer>
  <div id="controls"><button id="back">← Back in time</button><span id="count" aria-live="polite"></span><button id="fwd" class="fwd">Walk forward →</button></div>
  <nav id="band" aria-label="Eras"></nav>
</footer>
<aside id="panel" aria-live="polite"><button class="x" aria-label="Close">×</button><div id="pbody"></div></aside>
<ol id="list" aria-label="All cards in order"></ol>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
const D = await import('./hymns-data.js');
let notes = {}; try { notes = (await import('./hymn-notes.js')).NOTES || {}; } catch (e) {}
await document.fonts.ready;

/* ---------- data ---------- */
const LANE = { hymn: { label: 'Hymns', color: '#b68235' }, church: { label: 'Church history', color: '#39465a' }, music: { label: 'Music history', color: '#7d6c57' }, world: { label: 'World events', color: '#a39d93' } };
const TINT = { hymn: '#fbf9f5', church: '#eef0f3', music: '#f3efe9', world: '#f1f0ee' };
const trad = Object.fromEntries((D.TRADITIONS || []).map(t => [t.id, t]));
const eras = (D.ERAS || []).slice().sort((a, b) => a.start - b.start);
const strip = t => String(t || '').replace(/\[\^\d+\]/g, '').replace(/\s+/g, ' ').trim();
const fy = y => y < 0 ? `${-y} BC` : String(y);
const eraOf = y => eras.find(e => y >= e.start && y < e.end) || (y < eras[0].start ? eras[0] : eras[eras.length - 1]);
const items = [];
(D.HYMNS || []).filter(h => h.featured && h.year != null).forEach(h => items.push({ key: 'h' + h.n, kind: 'hymn', n: h.n, year: h.year, note: h.yearNote || '', title: h.title, sub: [h.authorName, h.composerName].filter(Boolean).join(' · '), tune: h.tune || '', color: (trad[h.traditionId] || {}).color || LANE.hymn.color, tradLabel: (trad[h.traditionId] || {}).label || 'Hymn', text: strip(h.story) || strip((notes[h.n] || {}).blurb), image: h.image || '', credit: h.imageCredit || '' }));
(D.PSALM_CARDS || []).forEach(p => items.push({ key: p.key || 'ps' + p.psalm, kind: 'hymn', n: p.n, year: p.year, note: p.yearNote, title: p.title, sub: p.author, tune: `Sung as No. ${p.n} · ${p.hymnTitle}`, color: (trad.psalter || {}).color || '#1f3c5d', tradLabel: 'Psalter', text: p.story, verse: p.verse }));
[['church', 'CHURCH_EVENTS'], ['music', 'MUSIC_EVENTS'], ['world', 'WORLD_EVENTS']].forEach(([kind, k]) => (D[k] || []).filter(e => e.tag !== 'hymnal').forEach((e, i) => items.push({ key: kind[0] + i, kind, year: e.year, note: e.tag === 'prologue' ? 'In the beginning' : (e.yearNote || ''), prologue: e.tag === 'prologue', title: e.title, sub: '', text: strip(e.text), color: LANE[kind].color, image: e.image || '', credit: e.credit || '' })));
const order = { hymn: 0, church: 1, music: 2, world: 3 };
items.sort((a, b) => (b.prologue - a.prologue) || a.year - b.year || order[a.kind] - order[b.kind]);
items.forEach(it => { it.era = eraOf(it.year).id; it.dateText = it.prologue ? 'In the beginning' : (it.note && !/^\d+$/.test(it.note) ? it.note : fy(it.year)); });

const lanesOn = { hymn: true, church: true, music: true, world: true };
let vis = items.slice();
const listEl = document.getElementById('list');

/* ---------- three.js scene ---------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.domElement.className = 'gl';
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const BG = new THREE.Color('#f3f2f2');
scene.background = BG;
scene.fog = new THREE.Fog(BG, 14, 62);
const camera = new THREE.PerspectiveCamera(52, 1, 0.1, 200);
scene.add(new THREE.AmbientLight(0xffffff, 1));

const SP = 6;            // distance between cards along the road
const ROAD_W = 3.6;
const roadLen = () => (vis.length + 6) * SP;

// road
function roadTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 512; const g = c.getContext('2d');
  g.fillStyle = '#d9d0c1'; g.fillRect(0, 0, 256, 512);
  g.fillStyle = '#c4b8a5'; g.fillRect(0, 0, 6, 512); g.fillRect(250, 0, 6, 512);
  g.fillStyle = '#f7f4ee'; g.fillRect(124, 0, 8, 256);
  const t = new THREE.CanvasTexture(c); t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const roadTex = roadTexture();
const road = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_W, 1), new THREE.MeshBasicMaterial({ map: roadTex }));
road.rotation.x = -Math.PI / 2; scene.add(road);
// verge
const verge = new THREE.Mesh(new THREE.PlaneGeometry(80, 1), new THREE.MeshBasicMaterial({ color: '#ebe5da' }));
verge.rotation.x = -Math.PI / 2; verge.position.y = -0.01; scene.add(verge);
function layoutRoad() {
  const L = roadLen();
  road.scale.y = L; road.position.z = -L / 2 + 8; roadTex.repeat.set(1, L / 3); roadTex.needsUpdate = true;
  verge.scale.y = L + 200; verge.position.z = -L / 2;
}

/* card textures, created only for cards near the camera */
const CW = 2.7, CH = 1.75, TW = 864, TH = 560;
function wrap(g, text, x, y, maxW, lh, maxLines) {
  const words = String(text || '').split(' '); let line = '', n = 0;
  for (let i = 0; i < words.length; i++) {
    const test = line ? line + ' ' + words[i] : words[i];
    if (g.measureText(test).width > maxW && line) { g.fillText(n === maxLines - 1 ? line + '…' : line, x, y); line = words[i]; y += lh; if (++n >= maxLines) return y; }
    else line = test;
  }
  if (line) { g.fillText(line, x, y); y += lh; }
  return y;
}
const imgCache = {};
function loadImg(src) {
  if (!imgCache[src]) imgCache[src] = new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
  return imgCache[src];
}
function drawCard(it, img) {
  const c = document.createElement('canvas'); c.width = TW; c.height = TH; const g = c.getContext('2d');
  g.fillStyle = TINT[it.kind]; g.fillRect(0, 0, TW, TH);
  g.fillStyle = it.color; g.fillRect(0, 0, TW, it.kind === 'hymn' ? 16 : 10);
  let x = 40, w = TW - 80;
  if (img) {
    const iw = 300, ih = TH - 16; const s = Math.max(iw / img.width, ih / img.height);
    const sw = iw / s, sh = ih / s; g.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, TW - iw, 16, iw, ih);
    w = TW - iw - 80;
  }
  g.fillStyle = '#5d6470'; g.font = '600 24px Lora'; g.textBaseline = 'top';
  const kick = (it.kind === 'hymn' ? it.tradLabel : LANE[it.kind].label).toUpperCase();
  g.fillText(kick, x, 44);
  g.fillStyle = it.kind === 'hymn' ? '#8a6024' : '#2b3340';
  const dt = it.dateText; g.font = (dt.length > 14 ? '500 44px' : '500 68px') + ' "Cormorant Garamond"';
  g.fillText(dt, x, 80);
  let y = dt.length > 14 ? 138 : 162;
  g.fillStyle = '#1d2430'; g.font = '600 46px "Cormorant Garamond"'; y = wrap(g, it.title, x, y, w, 50, 2) + 6;
  if (it.sub) { g.fillStyle = '#3c4350'; g.font = '28px Lora'; y = wrap(g, it.sub, x, y, w, 36, 2) + 4; }
  if (it.kind === 'hymn' && it.tune) { g.fillStyle = '#5d6470'; g.font = '600 22px Lora'; y = wrap(g, it.tune.toUpperCase(), x, y + 4, w, 30, 2); }
  else if (it.text) { g.fillStyle = '#3c4350'; g.font = '27px Lora'; wrap(g, it.text, x, y, w, 37, Math.max(1, Math.floor((TH - 30 - y) / 37))); }
  if (it.kind === 'hymn' && it.n) { // hymnal number roundel
    g.beginPath(); g.arc(TW - (img ? 340 : 60), 60, 34, 0, Math.PI * 2); g.fillStyle = '#b68235'; g.fill();
    g.fillStyle = '#fff'; g.font = '600 26px Lora'; g.textAlign = 'center'; g.fillText(String(it.n), TW - (img ? 340 : 60), 46); g.textAlign = 'left';
  }
  g.strokeStyle = 'rgba(0,0,0,.08)'; g.lineWidth = 2; g.strokeRect(1, 1, TW - 2, TH - 2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function yearTexture(text) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 128; const g = c.getContext('2d');
  g.fillStyle = 'rgba(122,90,37,.85)'; g.font = '500 84px "Cormorant Garamond"'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, 256, 64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const cardGeo = new THREE.PlaneGeometry(CW, CH), yearGeo = new THREE.PlaneGeometry(1.6, 0.4), shadowGeo = new THREE.PlaneGeometry(CW * 1.05, 0.7);
const shadowTex = (() => { const c = document.createElement('canvas'); c.width = 128; c.height = 64; const g = c.getContext('2d'); const gr = g.createRadialGradient(64, 32, 4, 64, 32, 60); gr.addColorStop(0, 'rgba(60,45,25,.35)'); gr.addColorStop(1, 'rgba(60,45,25,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 64); return new THREE.CanvasTexture(c); })();
const live = new Map(); // key -> {group, card, refl, year, shadow}
function side(i) { return i % 2 === 0 ? -1 : 1; }
function cardPos(i) { return new THREE.Vector3(side(i) * (ROAD_W / 2 + CW / 2 + 0.25), CH / 2 + 0.35, -i * SP); }
function makeCard(it, i) {
  const grp = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ map: drawCard(it, null), transparent: true });
  const card = new THREE.Mesh(cardGeo, mat); card.userData.key = it.key;
  const p = cardPos(i); card.position.copy(p); card.rotation.y = -side(i) * 0.32;
  const reflMat = new THREE.MeshBasicMaterial({ map: mat.map, transparent: true, opacity: 0.16, depthWrite: false });
  const refl = new THREE.Mesh(cardGeo, reflMat); refl.position.set(p.x, -CH / 2 - 0.35 + 0.0, p.z); refl.rotation.y = card.rotation.y; refl.scale.y = -1;
  const shadow = new THREE.Mesh(shadowGeo, new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }));
  shadow.rotation.x = -Math.PI / 2; shadow.position.set(p.x, 0.01, p.z + 0.15);
  const ym = new THREE.Mesh(yearGeo, new THREE.MeshBasicMaterial({ map: yearTexture(it.prologue ? '' : fy(it.year)), transparent: true, depthWrite: false }));
  ym.rotation.x = -Math.PI / 2; ym.position.set(side(i) * (ROAD_W / 2 - 0.85), 0.02, p.z + 1.4);
  grp.add(card, refl, shadow, ym); scene.add(grp);
  const rec = { grp, card, refl, mats: [mat, reflMat, ym.material, shadow.material], it };
  live.set(it.key, rec);
  if (it.image) loadImg(it.image).then(img => { if (!img || !live.has(it.key)) return; const old = mat.map; const t = drawCard(it, img); mat.map = t; reflMat.map = t; mat.needsUpdate = reflMat.needsUpdate = true; old.dispose(); });
  return rec;
}
function dropCard(key) {
  const r = live.get(key); if (!r) return;
  scene.remove(r.grp); r.mats.forEach(m => { if (m.map && m.map !== shadowTex) m.map.dispose(); m.dispose(); });
  live.delete(key);
}
function syncWindow() {
  const lo = Math.max(0, Math.floor(cur) - 3), hi = Math.min(vis.length - 1, Math.floor(cur) + 14);
  const want = new Set(); for (let i = lo; i <= hi; i++) want.add(vis[i].key);
  for (const k of [...live.keys()]) if (!want.has(k)) dropCard(k);
  for (let i = lo; i <= hi; i++) if (!live.has(vis[i].key)) makeCard(vis[i], i);
}

/* ---------- motion ---------- */
let idx = 0, cur = 0; // target index, animated position
function go(n) { idx = Math.max(0, Math.min(vis.length - 1, n)); ui(); }
const back = () => go(idx - 1), fwd = () => go(idx + 1);
document.getElementById('back').onclick = back; document.getElementById('fwd').onclick = fwd;
let acc = 0, lastStep = 0;
stage.addEventListener('wheel', e => { e.preventDefault(); acc += e.deltaY; const now = performance.now(); if (Math.abs(acc) > 70 && now - lastStep > 180) { go(idx + (acc > 0 ? 1 : -1)); acc = 0; lastStep = now; } }, { passive: false });
let ty = null;
stage.addEventListener('touchstart', e => { ty = e.touches[0].clientY; }, { passive: true });
stage.addEventListener('touchmove', e => { if (ty == null) return; const dy = ty - e.touches[0].clientY; e.preventDefault(); if (Math.abs(dy) > 45) { go(idx + (dy > 0 ? 1 : -1)); ty = e.touches[0].clientY; } }, { passive: false });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') return closePanel();
  if (['ArrowUp', 'ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); fwd(); }
  if (['ArrowDown', 'ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); back(); }
  if (e.key === 'Enter' && vis[idx]) openPanel(vis[idx]);
});
// click a card
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
renderer.domElement.addEventListener('click', e => {
  const r = renderer.domElement.getBoundingClientRect(); ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects([...live.values()].map(v => v.card))[0];
  if (hit) { const k = hit.object.userData.key; const i = vis.findIndex(v => v.key === k); if (i >= 0) { if (i !== idx) go(i); openPanel(vis[i]); } }
});
renderer.domElement.addEventListener('mousemove', e => {
  const r = renderer.domElement.getBoundingClientRect(); ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera); renderer.domElement.style.cursor = ray.intersectObjects([...live.values()].map(v => v.card)).length ? 'pointer' : 'grab';
});

/* ---------- panel ---------- */
const panel = document.getElementById('panel'), pbody = document.getElementById('pbody');
panel.querySelector('.x').onclick = closePanel;
function esc(s) { return String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function openPanel(it) {
  pbody.innerHTML = `<div class="kick">${esc(it.kind === 'hymn' ? it.tradLabel : LANE[it.kind].label)}</div><h2>${esc(it.title)}</h2><div class="yr">${esc(it.dateText)}</div>`
    + (it.image ? `<img src="${esc(it.image)}" alt="${esc(it.title)}"><div class="cr">${esc(it.credit)}</div>` : '')
    + (it.sub ? `<p><strong>${esc(it.sub)}</strong></p>` : '') + (it.verse ? `<blockquote>${esc(it.verse)}</blockquote>` : '')
    + (it.text ? `<p>${esc(it.text)}</p>` : '') + (it.kind === 'hymn' && it.tune ? `<p class="cr">${esc(it.tune)}</p>` : '')
    + (it.n ? `<a class="go" href="index.html#/hymn/${it.n}">Open hymn No. ${it.n} →</a>` : '');
  panel.classList.add('open');
}
function closePanel() { panel.classList.remove('open'); }

/* ---------- lanes, era band, list ---------- */
const lanesEl = document.getElementById('lanes');
Object.entries(LANE).forEach(([k, v]) => {
  const b = document.createElement('button'); b.setAttribute('aria-pressed', 'true'); b.innerHTML = `<i style="background:${v.color}"></i>${v.label}`;
  b.onclick = () => { lanesOn[k] = !lanesOn[k]; b.setAttribute('aria-pressed', String(lanesOn[k])); rebuild(); };
  lanesEl.appendChild(b);
});
const band = document.getElementById('band');
eras.forEach(e => { const b = document.createElement('button'); b.textContent = e.short || e.label; b.title = e.label; b.onclick = () => { const i = vis.findIndex(v => v.era === e.id); if (i >= 0) go(i); }; band.appendChild(b); e.btn = b; });
function rebuild() {
  const key = vis[idx] && vis[idx].key;
  vis = items.filter(it => lanesOn[it.kind]);
  for (const k of [...live.keys()]) dropCard(k);
  let i = vis.findIndex(v => v.key === key); if (i < 0) i = Math.min(idx, vis.length - 1);
  idx = Math.max(0, i); cur = idx; layoutRoad(); ui();
  listEl.innerHTML = vis.map(v => `<li>${esc(v.dateText)}: ${esc(v.title)}${v.sub ? ', ' + esc(v.sub) : ''}. ${esc(v.text || '')}</li>`).join('');
}
function ui() {
  document.getElementById('count').textContent = vis.length ? `${idx + 1} of ${vis.length}` : 'No cards';
  const er = vis[idx] && vis[idx].era; eras.forEach(e => e.btn.setAttribute('aria-current', String(e.id === er)));
}

/* ---------- render loop ---------- */
function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < 700 ? 64 : 52; camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize);
let lastSync = -1;
function frame() {
  cur += (idx - cur) * 0.09;
  if (Math.abs(idx - cur) < 0.001) cur = idx;
  const z = -cur * SP + 5.2;
  camera.position.set(Math.sin(cur * 0.6) * 0.15, 1.75, z);
  camera.lookAt(0, 1.05, z - 9);
  const f = Math.floor(cur); if (f !== lastSync) { syncWindow(); lastSync = f; }
  // fade cards behind the camera and the far ones
  live.forEach(r => { const d = (r.card.position.z - z) ; const o = d > -1.2 ? Math.max(0, 1 - (d + 1.2) / 2.2) : 1; r.mats[0].opacity = o; r.mats[1].opacity = 0.16 * o; r.mats[2].opacity = o; });
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
resize(); rebuild(); document.getElementById('loading').remove(); frame();
</script>
